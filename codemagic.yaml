workflows:
  android-all:
    name: Block Clash — Debug APK + Release APK + AAB
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "cubora.blockblast.game"
        # TEST ads until the app is live on Play. Flip to "false" ONLY for the real
        # Play Store release (never click your own live ads - it can ban the account).
        ADS_TEST: "true"
        # "true" only if the Play Console target audience includes children.
        ADS_CHILD_DIRECTED: "false"
      # To sign Play Store releases with your own upload keystore on Codemagic:
      # 1. Create an Environment Variable group (e.g. `android_keystore`) with:
      #    CM_KEYSTORE_BASE64, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      # 2. Uncomment `groups:` below and the keystore decode lines in the script.
      # groups:
      #   - android_keystore
    scripts:
      - name: Install Node dependencies & run verification tests
        script: |
          npm install --no-audit --no-fund
          npx --yes tsx --test src/utils/*.test.ts
          npm run lint
          npm run build
      - name: Build offline WebView game bundle (assets/game/index.html)
        script: |
          npm run build:android
      - name: Run Flutter tests
        script: |
          flutter pub get
          flutter test
      - name: Decode keystore if configured
        script: |
          if [ -n "${CM_KEYSTORE_BASE64:-}" ]; then
            echo "$CM_KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
            echo "CM_KEYSTORE_PATH=/tmp/upload-keystore.jks" >> "$CM_ENV"
          fi
      - name: Bootstrap & configure Android project
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org cubora.blockblast.game --project-name cubora
          fi
          node scripts/configure-android-ci.mjs
      - name: Build Debug APK, Release APK and Play Store AAB
        script: |
          ADS_DEFINES="--dart-define=ADS_TEST=$ADS_TEST --dart-define=ADS_CHILD_DIRECTED=$ADS_CHILD_DIRECTED"
          flutter build apk --debug $ADS_DEFINES
          flutter build apk --release $ADS_DEFINES
          flutter build appbundle --release $ADS_DEFINES
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        notify:
          success: true
          failure: true
