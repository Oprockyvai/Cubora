workflows:
  android-all:
    name: Block Clash — Debug APK + Release APK + AAB
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "cubora.blockclash.game"
        # TEST ads until the app is live on Play. Flip to "false" ONLY for the real
        # Play Store release (never click your own live ads - it can ban the account).
        ADS_TEST: "true"
        # "true" only if the Play Console target audience includes children.
        ADS_CHILD_DIRECTED: "false"
      # To sign Play Store releases with your own upload keystore on Codemagic:
      # 1. Create an Environment Variable group (e.g. `android_keystore`) with:
      #    CM_KEYSTORE_BASE64, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      # 2. Uncomment `groups:` below and the keystore decode lines in the script.
      # groups:
      #   - android_keystore
    scripts:
      - name: Install Node dependencies & run verification tests
        script: |
          npm install --no-audit --no-fund
          npx --yes tsx --test src/utils/*.test.ts
          npm run lint
          npm run build
      - name: Build offline WebView game bundle (assets/game/index.html)
        script: |
          npm run build:android
      - name: Run Flutter tests
        script: |
          flutter pub get
          flutter test
      - name: Decode keystore if configured
        script: |
          if [ -n "${CM_KEYSTORE_BASE64:-}" ]; then
            echo "$CM_KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
            echo "CM_KEYSTORE_PATH=/tmp/upload-keystore.jks" >> "$CM_ENV"
          fi
      - name: Bootstrap & configure Android project
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org cubora.blockclash.game --project-name cubora
          fi
          node scripts/configure-android-ci.mjs
      - name: Build Debug APK, Release APK and Play Store AAB
        script: |
          ADS_DEFINES="--dart-define=ADS_TEST=$ADS_TEST --dart-define=ADS_CHILD_DIRECTED=$ADS_CHILD_DIRECTED"
          flutter build apk --debug $ADS_DEFINES
          flutter build apk --release $ADS_DEFINES
          flutter build appbundle --release $ADS_DEFINES
          # Clear names so these debug-signed files are never mistaken for the Play ones.
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/TEST-debugsigned-NOT-FOR-PLAY.aab
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/TEST-debugsigned-NOT-FOR-PLAY.aab

  android-play-release:
    name: Block Clash — Play Store Release (signed AAB + APK)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      node: 22
      java: 21
      # Create this keystore FIRST in Codemagic (Teams > Code signing identities >
      # Android keystores > Generate keystore) and name its reference EXACTLY:
      android_signing:
        - blockclash_upload
      vars:
        PACKAGE_NAME: "cubora.blockclash.game"
        # "false" = REAL ads (Play Store release build). Do not click your own live ads.
        # Set back to "true" for any build you will test on your own phone.
        ADS_TEST: "false"
        ADS_CHILD_DIRECTED: "false"
    scripts:
      - name: Install Node dependencies & run verification tests
        script: |
          npm install --no-audit --no-fund
          npx --yes tsx --test src/utils/*.test.ts
          npm run lint
          npm run build
      - name: Build offline WebView game bundle (assets/game/index.html)
        script: |
          npm run build:android
      - name: Run Flutter tests
        script: |
          flutter pub get
          flutter test
      - name: Bootstrap & configure Android project (release signing)
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org cubora.blockclash.game --project-name cubora
          fi
          node scripts/configure-android-ci.mjs
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts \
            || { echo "ERROR: release signing was not applied"; exit 1; }
      - name: Build signed Release AAB and APK
        script: |
          ADS_DEFINES="--dart-define=ADS_TEST=$ADS_TEST --dart-define=ADS_CHILD_DIRECTED=$ADS_CHILD_DIRECTED"
          # Play needs a strictly increasing versionCode for every upload.
          flutter build appbundle --release --build-number=$BUILD_NUMBER $ADS_DEFINES
          flutter build apk --release --build-number=$BUILD_NUMBER $ADS_DEFINES
      - name: Verify the AAB is signed with the upload key (not debug)
        script: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | tee /tmp/aab-cert.txt
          if grep -qi "Android Debug" /tmp/aab-cert.txt; then
            echo "ERROR: AAB is signed with the DEBUG key"; exit 1
          fi
          grep -q "Block Clash" /tmp/aab-cert.txt \
            || { echo "ERROR: AAB is not signed with the Block Clash upload key"; exit 1; }
          cp "$AAB" build/app/outputs/bundle/release/PLAY-UPLOAD-signed.aab
    artifacts:
      - build/app/outputs/bundle/release/PLAY-UPLOAD-signed.aab
      - build/app/outputs/flutter-apk/app-release.apk
