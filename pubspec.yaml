name: cubora
description: Block Clash - a tactile offline block puzzle game.
publish_to: "none"

# version: <name>+<build number>. Increase the build number (+1, +2 ...) for every Play Store upload.
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  # Ads: AdMob is the primary SDK; Unity Ads runs inside AdMob mediation.
  google_mobile_ads: ^9.2.0
  gma_mediation_unity: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/game/
    - assets/game/img/
    - assets/branding/
